version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: bookkeeping-db
    environment:
      POSTGRES_USER: bookkeeper
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: bookkeeping
      POSTGRES_INITDB_ARGS: "-c timezone='UTC'"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookkeeper"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookkeeping-api
    environment:
      DATABASE_URL: postgresql://bookkeeper:dev_password@postgres:5432/bookkeeping
      JWT_SECRET: dev-secret-key-change-in-production-min-32-chars
      NODE_ENV: development
      PORT: 5000
      API_URL: http://localhost:5000
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - /app/node_modules
    command: npm run dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookkeeping-ui
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_APP_NAME: Bookkeeping
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - /app/node_modules
    command: npm run dev

  # Optional: Adminer for database inspection
  adminer:
    image: adminer:latest
    container_name: bookkeeping-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: bookkeeping-network
