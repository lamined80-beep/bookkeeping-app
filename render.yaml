services:
  - type: web
    name: bookkeeping-backend
    runtime: node
    buildCommand: cd backend && npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: cd backend && npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bookkeeping-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 7d
      - key: PORT
        value: 5000

  - type: web
    name: bookkeeping-frontend
    runtime: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run preview
    envVars:
      - key: VITE_API_URL
        fromService:
          name: bookkeeping-backend
        type: web_service
          property: renderURL
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5173

databases:
  - name: bookkeeping-db
    databaseName: bookkeeping
    user: bookkeeping_user
    region: oregon
