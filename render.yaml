services:
  - type: web
    name: bookkeeping-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    healthCheckPath: /health
    buildCommand: npm install --include=dev && npx prisma generate && (npm run build || echo "tsc reported type errors - continuing with emitted JS") && npx prisma db push --accept-data-loss --skip-generate && (npx tsx prisma/seed.ts || echo "seed skipped - database already populated")
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bookkeeping-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 7d
      - key: CORS_ORIGIN
        value: https://bookkeeping-frontend-xosi.onrender.com

  - type: web
    name: bookkeeping-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --include=dev && npx vite build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://bookkeeping-backend-1tht.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: bookkeeping-db
    databaseName: bookkeeping
    user: bookkeeping_user
    plan: free
    region: oregon
